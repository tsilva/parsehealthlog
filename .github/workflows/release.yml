name: Release

on:
  push:
    branches: [main]
    paths: [parsehealthlog/__init__.py]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  build:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.check-version.outputs.fully_published == 'false' }}
      publish: ${{ steps.check-version.outputs.pypi_exists == 'false' }}
      release: ${{ steps.check-version.outputs.release_exists == 'false' }}
      tag: ${{ steps.check-version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check release targets
        id: check-version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python - <<'PY'
          import re
          import tomllib

          with open("pyproject.toml", "rb") as f:
              config = tomllib.load(f)

          project = config.get("project", {})
          if "version" in project:
              print(project["version"])
          elif "version" in project.get("dynamic", []):
              version_path = config.get("tool", {}).get("hatch", {}).get("version", {}).get("path")
              if not version_path:
                  raise ValueError("Dynamic version specified but no hatch.version.path found")
              with open(version_path) as vf:
                  match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', vf.read())
              if not match:
                  raise ValueError(f"Could not find __version__ in {version_path}")
              print(match.group(1))
          else:
              raise ValueError("No version found in pyproject.toml")
          PY
          )
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          else
            RELEASE_EXISTS=false
          fi
          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"

          PYPI_EXISTS=$(python - "$VERSION" <<'PY'
          import sys
          import urllib.error
          import urllib.request

          url = f"https://pypi.org/pypi/parsehealthlog/{sys.argv[1]}/json"
          try:
              with urllib.request.urlopen(url, timeout=10) as response:
                  print("true" if response.status == 200 else "false")
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print("false")
              else:
                  raise
          PY
          )
          echo "pypi_exists=$PYPI_EXISTS" >> "$GITHUB_OUTPUT"

          if [ "$RELEASE_EXISTS" = "true" ] && [ "$PYPI_EXISTS" = "true" ]; then
            echo "fully_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "fully_published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup uv
        if: steps.check-version.outputs.fully_published == 'false'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Build package
        if: steps.check-version.outputs.fully_published == 'false'
        run: uv build
      - name: Store package artifacts
        if: steps.check-version.outputs.fully_published == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build]
    if: needs.build.outputs.artifact == 'true' && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-${{ github.sha }}
          path: dist/
      - name: Create GitHub release
        run: gh release create "$TAG" --title "$TAG" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}

  publish:
    needs: [build]
    if: needs.build.outputs.artifact == 'true' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-${{ github.sha }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
